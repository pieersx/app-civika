name: Release Android

# Compila el APK firmado y lo publica como GitHub Release cuando se sube una etiqueta `v0.MINOR.PATCH`.
# Secretos del repo que necesita (Settings → Secrets and variables → Actions; ver docs/despliegue.md §4):
#   SUPABASE_URL, SUPABASE_ANON_KEY            clave anon/publishable del proyecto de producción (nunca service_role)
#   ANDROID_KEYSTORE_BASE64                    el .jks en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64                google-services.json en base64 (opcional: sin él no hay push)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    name: APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Preparar keystore y google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/civika-release.jks"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          else
            echo "::warning::Sin GOOGLE_SERVICES_JSON_BASE64: el APK no recibirá notificaciones push"
          fi

      - name: Compilar el APK de release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/civika-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain

      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "civika-$ETIQUETA.apk"
          gh release create "$ETIQUETA" "civika-$ETIQUETA.apk" --title "Cívika $ETIQUETA" --generate-notes
