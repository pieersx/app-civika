name: Release Android

# Compila el APK firmado y lo publica como GitHub Release cuando se sube una etiqueta `v0.MINOR.PATCH`.
# Secretos del repo que necesita (Settings → Secrets and variables → Actions; ver docs/despliegue.md §4):
#   SUPABASE_URL, SUPABASE_ANON_KEY            clave anon/publishable del proyecto de producción (nunca service_role)
#   ANDROID_KEYSTORE_BASE64                    el .jks en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64                google-services.json en base64 (opcional: sin él no hay push)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    name: APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validar la etiqueta
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          if [[ ! "$ETIQUETA" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::La etiqueta debe ser vMAYOR.MENOR.PARCHE (por ejemplo v0.2.0), sin sufijos; recibí $ETIQUETA"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Preparar keystore y google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Sin los cuatro datos de firma Gradle genera un APK sin firmar que no se puede instalar.
          for nombre in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta el secreto $nombre"; exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/civika-release.jks"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          else
            echo "::warning::Sin GOOGLE_SERVICES_JSON_BASE64: el APK no recibirá notificaciones push"
          fi

      # El release no espera al CI de la etiqueta: se repiten las pruebas antes de firmar nada.
      - name: Pruebas antes de publicar
        run: ./gradlew :shared:allTests :androidApp:testDebugUnitTest --console=plain

      - name: Compilar el APK de release
        env:
          ETIQUETA: ${{ github.ref_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/civika-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -Pcivika.versionName="${ETIQUETA#v}" --console=plain

      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          # Solo un APK firmado: si Gradle dejó uno «unsigned» o hay más de uno, se aborta.
          mapfile -t apks < <(ls androidApp/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" == *unsigned* ]]; then
            echo "::error::Se esperaba un único APK firmado y salió: ${apks[*]}"; exit 1
          fi
          cp "${apks[0]}" "civika-$ETIQUETA.apk"
          gh release create "$ETIQUETA" "civika-$ETIQUETA.apk" --title "Cívika $ETIQUETA" --generate-notes
