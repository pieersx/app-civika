name: CI

# Solo corre cuando cambia algo que se compila o se prueba; los cambios de documentación y de skills no lo activan.
# Ojo: si algún día el ruleset de main exige este check como obligatorio, un PR que solo cambie docs se quedaría
# esperándolo para siempre. Antes de exigirlo, añade un job que siempre corra y pase cuando no hay cambios de código.
# Las dos listas de rutas deben ser iguales.
on:
  pull_request:
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webPanel/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "kotlin-js-store/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webPanel/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "kotlin-js-store/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Pruebas de shared (JVM y Wasm)
        run: ./gradlew :shared:allTests --console=plain

      - name: Lint, pruebas y APK de Android
        run: ./gradlew :androidApp:lint :androidApp:testDebugUnitTest :androidApp:assembleDebug --console=plain

      - name: Build del panel web (Wasm)
        run: ./gradlew :webPanel:wasmJsBrowserDistribution --console=plain

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
