name: CI

# Solo corre cuando cambia algo que se compila o se prueba; los cambios de documentación y de skills no lo activan.
# Ojo: si algún día el ruleset de main exige este check como obligatorio, un PR que solo cambie docs se quedaría
# esperándolo para siempre. Antes de exigirlo, añade un job que siempre corra y pase cuando no hay cambios de código.
# Las dos listas de rutas deben ser iguales.
on:
  pull_request:
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webPanel/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "androidApp/**"
      - "webPanel/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: App Android y shared
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Sin claves de Supabase ni google-services.json: la app compila en modo demostración.
      - name: Pruebas de shared
        run: ./gradlew :shared:allTests --console=plain

      - name: Lint, pruebas y APK de Android
        run: ./gradlew :androidApp:lint :androidApp:testDebugUnitTest :androidApp:assembleDebug --console=plain

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-android
          path: |
            **/build/reports/
            **/build/test-results/

  panel:
    name: Panel web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webPanel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webPanel/package-lock.json

      - run: npm ci

      - name: Tipos, lint y pruebas
        run: |
          npm run typecheck
          npm run lint
          npm test

      # El build no necesita claves: sin ellas el panel muestra «Falta configurar».
      - name: Build de producción
        run: npm run build

  supabase:
    name: Base de datos (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Levantar Supabase local
        run: supabase start

      - name: Pruebas de esquema, RLS y RPC
        run: supabase test db

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup
