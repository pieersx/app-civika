<svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif" font-size="12.5" role="img" aria-labelledby="t d">
  <title id="t">Flujo del reporte de una incidencia (v2)</title>
  <desc id="d">El ciudadano inicia sesión, captura la foto y el GPS, y confirma la categoría sugerida por ML Kit. Si existe un incidente abierto dentro del radio de la categoría, lo apoya y se recalcula la prioridad. Si no, se crea el incidente, se ubica su zona y se busca la regla de ruteo: con regla queda Derivado automáticamente; sin regla pasa a En revisión y un moderador asigna la entidad. La entidad lo atiende y los seguidores reciben la notificación y la pregunta de si sigue arreglado.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

  <g stroke="#333" fill="#fff">
    <rect x="90" y="4" width="240" height="26" rx="13" fill="#e4ecf7"/>
    <rect x="90" y="40" width="240" height="28" rx="3"/>
    <rect x="90" y="78" width="240" height="28" rx="3"/>
    <rect x="90" y="116" width="240" height="36" rx="3"/>
    <polygon points="210,162 340,206 210,250 80,206" fill="#fdf3dc"/>
    <rect x="90" y="268" width="240" height="28" rx="3"/>
    <rect x="90" y="306" width="240" height="36" rx="3"/>
    <polygon points="210,352 300,382 210,412 120,382" fill="#fdf3dc"/>
    <rect x="90" y="428" width="240" height="28" rx="3"/>
    <rect x="90" y="472" width="240" height="36" rx="3"/>
    <rect x="90" y="524" width="240" height="36" rx="3"/>
    <rect x="90" y="572" width="240" height="24" rx="12" fill="#e4ecf7"/>
    <rect x="420" y="186" width="230" height="40" rx="3"/>
    <rect x="420" y="262" width="230" height="28" rx="3"/>
    <rect x="420" y="364" width="230" height="36" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#000">
    <text x="210" y="21">Inicio</text>
    <text x="210" y="58">Iniciar sesión</text>
    <text x="210" y="96">Capturar foto y obtener GPS</text>
    <text x="210" y="131">ML Kit sugiere la categoría y</text><text x="210" y="146">el ciudadano la confirma</text>
    <text x="210" y="200">¿Incidente abierto dentro del</text><text x="210" y="216">radio de la categoría?</text>
    <text x="210" y="286">Crear incidente (crear_reporte)</text>
    <text x="210" y="321">Ubicar la zona (PostGIS) y</text><text x="210" y="336">buscar la regla de ruteo</text>
    <text x="210" y="387">¿Hay regla de ruteo?</text>
    <text x="210" y="446">Derivado automático a la entidad</text>
    <text x="210" y="487">La entidad atiende</text><text x="210" y="502">(En atención → Resuelto)</text>
    <text x="210" y="539">Notificación push y</text><text x="210" y="554">«¿sigue arreglado?» a seguidores</text>
    <text x="210" y="588">Fin</text>
    <text x="535" y="203">Apoyar el incidente existente</text><text x="535" y="218">(+1 apoyo, fotos opcionales)</text>
    <text x="535" y="280">Recalcular prioridad</text>
    <text x="535" y="379">En revisión: un moderador</text><text x="535" y="394">asigna la entidad</text>
  </g>
  <g stroke="#222" stroke-width="1.3" fill="none" marker-end="url(#ar2)">
    <path d="M210,30 L210,40"/><path d="M210,68 L210,78"/><path d="M210,106 L210,116"/><path d="M210,152 L210,162"/>
    <path d="M210,250 L210,268"/><path d="M210,296 L210,306"/><path d="M210,342 L210,352"/>
    <path d="M210,412 L210,428"/><path d="M210,456 L210,472"/><path d="M210,508 L210,524"/><path d="M210,560 L210,572"/>
    <path d="M340,206 L420,206"/>
    <path d="M535,226 L535,262"/>
    <path d="M535,290 L535,340 L660,340 L660,542 L330,542"/>
    <path d="M300,382 L420,382"/>
    <path d="M535,400 L535,442 L330,442"/>
  </g>
  <g font-size="11.5">
    <text x="380" y="198" text-anchor="middle">Sí</text>
    <text x="218" y="262">No</text>
    <text x="360" y="375" text-anchor="middle">No</text>
    <text x="218" y="424">Sí</text>
  </g>
</svg>
