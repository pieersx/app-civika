<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif" font-size="12" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de Cívika (v2, Kotlin Multiplatform)</title>
  <desc id="d">Cliente Kotlin Multiplatform con los módulos shared, androidApp y webPanel; backend Supabase con PostgREST, Auth, funciones RPC, PostgreSQL con PostGIS, Storage y una Edge Function; servicios externos OpenFreeMap, Nominatim, polígonos de zonas y Firebase Cloud Messaging.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker>
  </defs>

  <!-- grupos -->
  <rect x="5" y="25" width="250" height="405" rx="6" fill="#f3f6fb" stroke="#333"/>
  <text x="130" y="45" text-anchor="middle" font-weight="bold" font-size="13">Cliente Kotlin Multiplatform</text>
  <rect x="300" y="25" width="200" height="405" rx="6" fill="#f4f8f1" stroke="#333"/>
  <text x="400" y="45" text-anchor="middle" font-weight="bold" font-size="13">Backend (Supabase)</text>
  <rect x="545" y="25" width="210" height="405" rx="6" fill="#fbf6ee" stroke="#333"/>
  <text x="650" y="45" text-anchor="middle" font-weight="bold" font-size="13">Servicios externos</text>

  <!-- cliente -->
  <rect x="18" y="60" width="224" height="122" rx="4" fill="#e6eef8" stroke="#333"/>
  <text x="130" y="79" text-anchor="middle" font-weight="bold">shared (Kotlin común)</text>
  <g fill="#fff" stroke="#333">
    <rect x="30" y="90" width="200" height="38" rx="4"/>
    <rect x="30" y="136" width="200" height="38" rx="4"/>
    <rect x="18" y="215" width="224" height="98" rx="4"/>
    <rect x="18" y="340" width="224" height="76" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#000">
    <text x="130" y="106">Dominio: estados, prioridad,</text><text x="130" y="121">validaciones</text>
    <text x="130" y="152">Datos: repositorios y</text><text x="130" y="167">supabase-kt sobre Ktor</text>
    <text x="130" y="235" font-weight="bold">androidApp (Jetpack Compose)</text>
    <text x="130" y="257">ViewModels · Room · WorkManager</text>
    <text x="130" y="276">CameraX · MapLibre · FCM</text>
    <text x="130" y="295">ML Kit (sugerencia de categoría)</text>
    <text x="130" y="360" font-weight="bold">webPanel (Compose Web)</text>
    <text x="130" y="380">Kotlin/Wasm · ViewModels</text>
    <text x="130" y="399">Entidad y moderación</text>
  </g>

  <!-- backend -->
  <g fill="#fff" stroke="#333">
    <rect x="312" y="60" width="176" height="34" rx="4"/>
    <rect x="312" y="104" width="176" height="34" rx="4"/>
    <rect x="312" y="148" width="176" height="60" rx="4"/>
    <rect x="312" y="218" width="176" height="44" rx="4"/>
    <rect x="312" y="272" width="176" height="34" rx="4"/>
    <rect x="312" y="316" width="176" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#000">
    <text x="400" y="82">API REST (PostgREST)</text>
    <text x="400" y="126">Autenticación (Auth)</text>
    <text x="400" y="167">Funciones RPC (SQL):</text>
    <text x="400" y="182">duplicados · ruteo ·</text>
    <text x="400" y="197">prioridad · estados</text>
    <text x="400" y="237">PostgreSQL + PostGIS</text>
    <text x="400" y="253" font-size="10.5">zonas, incidentes, RLS</text>
    <text x="400" y="294">Storage (fotografías)</text>
    <text x="400" y="335">Edge Function:</text>
    <text x="400" y="351">notificar</text>
  </g>

  <!-- servicios -->
  <g fill="#fff" stroke="#333">
    <rect x="557" y="60" width="186" height="40" rx="4"/>
    <rect x="557" y="112" width="186" height="40" rx="4"/>
    <rect x="557" y="218" width="186" height="44" rx="4" stroke-dasharray="5 3"/>
    <rect x="557" y="316" width="186" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#000">
    <text x="650" y="78">Teselas OpenFreeMap</text><text x="650" y="93" font-size="10.5">(datos OSM, uso desde la app)</text>
    <text x="650" y="130">Nominatim</text><text x="650" y="145" font-size="10.5">(dirección aproximada, desde la app)</text>
    <text x="650" y="237">Polígonos de las zonas</text><text x="650" y="253" font-size="10.5">(OSM, carga inicial)</text>
    <text x="650" y="335">Firebase Cloud</text><text x="650" y="351">Messaging (push)</text>
  </g>

  <!-- flechas -->
  <g stroke="#222" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M130,215 L130,184"/>
    <path d="M242,378 L249,378 L249,155 L232,155"/>
    <path d="M257,110 L298,110"/>
    <path d="M298,134 L259,134"/>
    <path d="M488,338 L555,338" stroke-dasharray="4 3"/>
    <path d="M555,240 L490,240" stroke-dasharray="4 3"/>
  </g>
  <text x="277" y="103" text-anchor="middle" font-size="10">HTTPS/JSON</text>
  <text x="278" y="148" text-anchor="middle" font-size="10">respuesta</text>
  <text x="521" y="331" text-anchor="middle" font-size="10">push</text>
  <text x="522" y="233" text-anchor="middle" font-size="10">seed</text>
</svg>
